services:
  postgres:
    image: postgres:16-alpine
    container_name: crea-fitness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crea_fitness
      POSTGRES_USER: crea
      POSTGRES_PASSWORD: crea_local_dev
    ports:
      - "5432:5432"
    volumes:
      - crea_fitness_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crea -d crea_fitness"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crea_fitness_data:
